# Builds Fostbraedr-<version>.zip and publishes a GitHub release when a tag
# like v0.2.0 is pushed. The tag must match "## Version:" in the .toc.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the .toc version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toc=$(sed -n 's/^## Version: *//p' Fostbraedr_Forever.toc | tr -d '\r')
          echo "tag=$tag toc=$toc"
          if [ "$tag" != "$toc" ]; then
            echo "::error::Tag v$tag doesn't match '## Version: $toc' in Fostbraedr_Forever.toc"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: |
          # git archive leaves out everything marked export-ignore in .gitattributes
          git archive --format=zip --prefix=Fostbraedr/ -o "Fostbraedr-${{ steps.version.outputs.version }}.zip" HEAD
          unzip -l "Fostbraedr-${{ steps.version.outputs.version }}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Fostbraedr-${{ steps.version.outputs.version }}.zip" \
            --title "Fostbraedr ${{ steps.version.outputs.version }}" \
            --notes "Download **Fostbraedr-${{ steps.version.outputs.version }}.zip** below and unpack it into \`World of Warcraft\\_forever_\\Interface\\AddOns\\\` (replace the old Fostbraedr folder). Then restart WoW."
